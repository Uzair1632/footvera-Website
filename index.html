    <!-- Safe fetch descriptor fix for iframe sandboxes -->
    <script>
      (function() {
        try {
          var origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var _currentFetch = origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Continue safely if already defined or restricted
        }
      })();
    </script>
