name: Deploy to Namecheap Hosting

on:
  push:
    branches: [ main ]

jobs:
  web-deploy:
    name: Build & FTP Deploy to Namecheap
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Production Distribution
        run: npm run build

     
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./dist/
          server-dir: ./
          dangerous-clean-slate: false
          state-name: '.ftp-deploy-sync-state.json'
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .htaccess
            cgi-bin/**
            .well-known/**
          log-level: verbose
